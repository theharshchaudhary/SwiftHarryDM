<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        :root { --accent: #2c5f8a; --accent-2: #3a7bb3; --text: #1c2733; --muted: #56657a; --border: #d5dde6; --bg: #f4f6f9; --ok: #2e8b57; --warn: #c77700; }
        @media (prefers-color-scheme: dark) {
            :root { --text: #e6ebf0; --muted: #9aa7b5; --border: #39414b; --bg: #1b1f24; --accent: #5b9bd5; --accent-2: #7ab3e6; --ok: #4caf7d; --warn: #f0a640; }
        }
        * { box-sizing: border-box; }
        body { width: 320px; margin: 0; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; color: var(--text); background: var(--bg); }
        header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--accent); color: #fff; }
        header img { width: 28px; height: 28px; }
        header b { font-size: 15px; }
        main { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
        .status { display: flex; align-items: center; gap: 8px; }
        .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); flex: none; }
        .dot.ok { background: var(--ok); }
        .btn { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: inherit; cursor: pointer; text-align: left; }
        .btn:hover { border-color: var(--accent-2); }
        .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); text-align: center; }
        .box { border: 1px solid var(--border); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .muted { color: var(--muted); font-size: 12px; }
        input[type=text] { width: 100%; padding: 8px; font-size: 18px; letter-spacing: 4px; text-align: center; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: inherit; }
        label { display: flex; gap: 8px; align-items: center; }
        .item { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
        .item span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 12px; text-align: left; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <header><img src="icons/icon48.png" alt=""><b>SwiftHarryDM</b></header>
    <main>
        <div class="status"><span id="dot" class="dot"></span><span id="status">Checking…</span></div>

        <div id="pairBox" class="box hidden">
            <div>Connect this browser to SwiftHarryDM. The app shows a 6-digit code.</div>
            <button id="pairStartBtn" class="btn primary">Connect with a code</button>
            <div id="pairStep2" class="hidden">
                <input id="pairCode" type="text" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="000000">
                <button id="pairConfirmBtn" class="btn primary" style="margin-top:8px">Confirm</button>
            </div>
        </div>

        <div id="actions" class="hidden" style="display:flex;flex-direction:column;gap:6px">
            <button id="videoBtn" class="btn">Download the video on this page</button>
            <button id="linksBtn" class="btn">Download links on this page…</button>
        </div>

        <label><input id="captureToggle" type="checkbox"> Take over downloads from this browser</label>
        <div class="muted">File types and exceptions are set in SwiftHarryDM › Options. Hold Alt while clicking a link to keep that download in the browser.</div>

        <div id="recent" class="box hidden"><b>Recent downloads</b><div id="list"></div></div>

        <button id="cookiesBtn" class="link">Send site cookies with taken-over downloads (for sites that need a login)</button>
        <button id="unpairBtn" class="link hidden">Disconnect this browser</button>
    </main>
    <script src="popup.js"></script>
</body>
</html>
