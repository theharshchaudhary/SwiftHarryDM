# Push a tag like v3.0.1 to publish a release. The installer and latest.json are signed
# with the updater key, so installed copies offer the update with one click.
# Secrets: TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ffmpeg:
    uses: ./.github/workflows/ffmpeg.yml

  release:
    needs: ffmpeg
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-slim
          path: tools/ffmpeg-slim
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui
      - name: Tests
        run: cargo test -p swiftdm-core
      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tauriScript: ui/node_modules/.bin/tauri
          tagName: ${{ github.ref_name }}
          releaseName: SwiftHarryDM ${{ github.ref_name }}
          releaseBody: See the changes below. Installed copies update with one click.
          releaseDraft: false
          includeUpdaterJson: true
