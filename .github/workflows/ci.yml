name: ci
on:
  push:
  pull_request:

jobs:
  ffmpeg:
    uses: ./.github/workflows/ffmpeg.yml

  test:
    needs: ffmpeg
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-slim
          path: tools/ffmpeg-slim
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI dependencies
        run: npm ci --prefix ui
      - name: UI type check
        run: npm run --prefix ui build
      - name: Core tests
        run: cargo test -p swiftdm-core
      - name: App tests
        run: cargo test -p swiftharrydm
      - name: Build the app and the test server
        run: |
          cargo build -p swiftdm-testkit --bin sdm-observe
          ui\node_modules\.bin\tauri build --debug --no-bundle
        shell: cmd
      # The runner image has Edge but not the WebView2 runtime the app's windows use.
      - name: WebView2 runtime
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (Test-Path $key) { "WebView2 $((Get-ItemProperty $key).pv) is installed"; exit 0 }
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP\wv2.exe"
          Start-Process "$env:RUNNER_TEMP\wv2.exe" -ArgumentList '/silent', '/install' -Wait
          "WebView2 $((Get-ItemProperty $key).pv) installed"
      - name: End-to-end tests (app and extension in Chrome)
        run: node tests/e2e/run.mjs
