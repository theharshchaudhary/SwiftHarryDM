name: ci
on:
  push:
  pull_request:

jobs:
  ffmpeg:
    uses: ./.github/workflows/ffmpeg.yml

  test:
    needs: ffmpeg
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-slim
          path: tools/ffmpeg-slim
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI dependencies
        run: npm ci --prefix ui
      - name: UI type check
        run: npm run --prefix ui build
      - name: Core tests
        run: cargo test -p swiftdm-core
      - name: App tests
        run: cargo test -p swiftharrydm
      - name: Build the app and the test server
        run: |
          cargo build -p swiftdm-testkit --bin sdm-observe
          ui\node_modules\.bin\tauri build --debug --no-bundle
        shell: cmd
      - name: End-to-end tests (app and extension in Chrome)
        run: node tests/e2e/run.mjs
