name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # nightly: includes live media tests
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (hash-checked)
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --require-hashes -r requirements-dev.lock
      - name: Fetch pinned media tools (FFmpeg, checksum-verified)
        run: python packaging/fetch_tools.py
      - name: Tests (PR gate)
        if: github.event_name != 'schedule'
        run: python -m pytest -m "not live"
      - name: Tests (nightly, incl. live)
        if: github.event_name == 'schedule'
        run: python -m pytest
