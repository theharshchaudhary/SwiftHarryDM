[package]
name = "keepfetch"
description = "Keepfetch download manager"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "keepfetch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
swiftdm-core = { path = "../crates/swiftdm-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-drag = "2.1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Power", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug", "Win32_System_Registry"] }
